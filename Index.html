<html lang="pt-BR">

  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");

@font-face {

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>gud store</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(160deg,#0d1621,#0a1f1c 60%,#0d1621);color:#f2f7ff;min-height:100vh}
h1,h2{font-family:'Baloo 2',cursive;margin:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:16px 16px 40px}
.logo{display:flex;align-items:center;gap:10px;padding:8px 0}
.logo .mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#00e676,#00b0ff);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:24px;color:#06281c}
.hero{background:linear-gradient(135deg,#00c853,#00b0ff);border-radius:22px;padding:22px 18px;margin:12px 0;color:#04241a}
.hero h2{font-size:24px}
.hero p{margin:6px 0 0;font-weight:600}
.gcard{background:#16222f;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px;margin:12px 0}
.apphead{display:flex;gap:12px;align-items:center}
.apphead img{width:72px;height:72px;border-radius:18px;object-fit:cover;background:#1c2b3d}
.apphead .inf b{font-size:19px}
.apphead .inf small{color:#9fb3c8}
.fotos{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.fotos img{width:110px;height:110px;object-fit:cover;border-radius:12px;flex-shrink:0}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:none;border-radius:16px;font-family:'Baloo 2';font-weight:700;font-size:18px;cursor:pointer;background:linear-gradient(135deg,#00e676,#00c853);color:#052a18;margin:8px 0}
.gbtn.blue{background:linear-gradient(135deg,#00b0ff,#2979ff);color:#fff}
.gbtn:disabled{opacity:.6}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.popup .box{background:#16222f;border-radius:22px;padding:32px 24px;max-width:320px;width:100%;text-align:center;border:1px solid rgba(0,230,118,.3)}
.gmark{width:84px;height:84px;border-radius:22px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:46px;color:#06281c;background:#2a3a4d;animation:carrega 1.2s ease-in-out infinite}
@keyframes carrega{0%{background:#2a3b4d;transform:scale(1)}50%{background:linear-gradient(135deg,#00e676,#00b0ff);transform:scale(1.08)}100%{background:linear-gradient(135deg,#00e676,#00c853);transform:scale(1)}}
.muted{color:#9fb3c8;font-size:13px}
.center{text-align:center}
.ver{font-size:12px;color:#9fb3c8;margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var NOME='Stylus Get Right';
var APK_BASE=['app/app.apk','app/stylus get right_1.apk'];
var PASTAS_ATT=['Atualiza\u00e7\u00f5es','Atualizacoes'];
var FOTOS=['Fotos/icon.jpg','Fotos/Foto 1.jpg','Fotos/Foto 2.jpg','Fotos/Foto 3.jpg'];
function $(id){return document.getElementById(id);}
function enc(u){return encodeURI(u);}
function existe(url){return fetch(url,{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok;}).catch(function(){return false;});}
function primeiroQueExiste(urls){
  var t=Promise.resolve(null);
  urls.forEach(function(u){t=t.then(function(f){if(f)return f;return existe(u).then(function(ok){return ok?u:null;});});});
  return t;
}
function buscarUpdates(versoes,v){
  if(v>9)return Promise.resolve();
  var urls=[];PASTAS_ATT.forEach(function(p){urls.push(p+'/v'+v+'.apk');});
  return primeiroQueExiste(urls).then(function(u){
    if(!u)return;
    versoes.push({versao:'0.'+v,arquivo:enc(u)});
    return buscarUpdates(versoes,v+1);
  });
}
function dl(){try{return localStorage.getItem('gud_dl')||'';}catch(e){return '';}}
function setDl(v){try{localStorage.setItem('gud_dl',v);}catch(e){}}
var APP=null;
function iniciar(){
  primeiroQueExiste(APK_BASE).then(function(base){
    if(!base){renderVazio();return;}
    var versoes=[{versao:'0.1',arquivo:enc(base)}];
    buscarUpdates(versoes,2).then(function(){
      var atual=versoes[versoes.length-1];
      APP={nome:NOME,versao:atual.versao,arquivo:atual.arquivo,versoes:versoes};
      render();
    });
  });
}
function renderVazio(){
  $('app').innerHTML='<div class="logo"><div class="mark">g</div><h1>gud store</h1></div>'
  +'<div class="gcard center"><h2>Nenhum app ainda</h2><p class="muted">Volte em breve! \ud83d\udc9a</p></div>';
}
function render(){
  var baixado=dl();
  var ehAtt=baixado && baixado!==APP.versao;
  var fotos=FOTOS.map(function(f){return '<img src="'+enc(f)+'" onerror="this.remove()">';}).join('');
  $('app').innerHTML='<div class="logo"><div class="mark">g</div><h1>gud store</h1></div>'
  +'<div class="hero"><h2>\ud83d\udc4b Ol\u00e1!</h2><p>Baixe os apps da gud studios. Boa e confi\u00e1vel! \ud83d\udc9a</p></div>'
  +'<div class="gcard"><div class="apphead"><img src="'+enc(FOTOS[0])+'" onerror="this.style.display=\'none\'"><div class="inf"><b>'+APP.nome+'</b><br><small>Vers\u00e3o '+APP.versao+'</small></div></div>'
  +'<div class="fotos">'+fotos+'</div>'
  +'<p class="muted">Toque abaixo para baixar o app no seu celular \ud83d\udcf1</p>'
  +(ehAtt
    ? '<button class="gbtn blue" id="btnDl" onclick="baixar(true)"><span class="material-icons">system_update</span> Atualizar para v'+APP.versao+'</button>'
    : '<button class="gbtn" id="btnDl" onclick="baixar(false)"><span class="material-icons">download</span> Baixar app</button>')
  +'<div class="ver center">vers\u00e3o mais recente: '+APP.versao+'</div></div>';
}
function baixar(ehAtt){
  var btn=$('btnDl');
  btn.disabled=true;
  btn.innerHTML='Aguardando...';
  setTimeout(function(){
    document.body.insertAdjacentHTML('beforeend',
    '<div class="popup" id="ppLoad"><div class="box"><div class="gmark">g</div><h2>Carregando</h2><p class="muted">Preparando seu download...</p></div></div>');
    setTimeout(function(){
      var a=document.createElement('a');
      a.href=APP.arquivo;
      a.download=NOME.replace(/\s+/g,'-')+'.apk';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){a.remove();},500);
      var pp=$('ppLoad');if(pp)pp.remove();
      setDl(APP.versao);
      render();
    },2200);
  },800);
}
iniciar();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
